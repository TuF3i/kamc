{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kamc-agent.secretName" . }}
  labels:
    {{- include "kamc-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecretKey }}: {{ required "token 必填（或使用 existingSecret）" .Values.token | quote }}
{{- end }}
