{{- if not .Values.secrets.existingSecret }}
{{- $passwordLogin := .Values.passwordLogin }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kamc-platform.secretName" . }}
  labels:
    {{- include "kamc-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseURL 必填（或使用 secrets.existingSecret）" .Values.secrets.databaseURL | quote }}
  oidc-client-id: {{ .Values.secrets.oidcClientID | quote }}
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | quote }}
  peer-token: {{ if gt (int .Values.replicaCount) 1 }}{{ required "secrets.peerToken 必填（多副本 peer 转发）" .Values.secrets.peerToken | quote }}{{ else }}{{ .Values.secrets.peerToken | quote }}{{ end }}
  avatar-secret: {{ required "secrets.avatarSecret 必填（生产环境平台强制要求）" .Values.secrets.avatarSecret | quote }}
  password-login-password: {{ if $passwordLogin.enabled }}{{ required "passwordLogin.password 必填（启用内置密码登录时）" $passwordLogin.password | quote }}{{ else }}""{{ end }}
{{- end }}
