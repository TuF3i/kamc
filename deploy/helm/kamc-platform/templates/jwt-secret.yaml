{{- if not .Values.jwtKeyring.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kamc-platform.jwtSecretName" . }}
  labels:
    {{- include "kamc-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-1.pem: {{ required "jwtKeyring.jwtKeyPEM 必填（或使用 jwtKeyring.existingSecret）" .Values.jwtKeyring.jwtKeyPEM | quote }}
{{- end }}
