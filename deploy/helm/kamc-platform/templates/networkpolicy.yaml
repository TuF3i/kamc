{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kamc-platform.fullname" . }}
  labels:
    {{- include "kamc-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kamc-platform.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # HTTP：默认允许所有来源（外部 Nginx/Ingress 网关）；可用 httpIngressFrom 收紧。
    - ports:
        - protocol: TCP
          port: 8080
      {{- with .Values.networkPolicy.httpIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # peer 端口：仅同 Release 的平台 Pod 互访
    - from:
        - podSelector:
            matchLabels:
              {{- include "kamc-platform.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9090
{{- end }}
