# kamc 平台接入层 Nginx 配置（设计文档 §10.1 修正版）
#
# 部署形态：Nginx ×2 + keepalived VIP（§7.7）；TLS 终结在此层。
# upstream 列表由部署工具渲染平台 Service Endpoints（3 副本），
# 或改用集群内 ingress-nginx（HA 形态见设计文档 §10）。
#
# 占位符：
#   __AM_DOMAIN__          平台对外域名（如 access-manager.example.com）
#   __AM_CERT__/__AM_KEY__ TLS 证书与私钥路径
#   __PLATFORM_ENDPOINTS__ 平台副本地址列表（10.0.0.x:8080）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream am_platform {
    least_conn;
    __PLATFORM_ENDPOINTS__
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;                                # kubectl 的 WS 拨号走 HTTP/1.1，不受影响
    server_name __AM_DOMAIN__;

    ssl_certificate     __AM_CERT__;
    ssl_certificate_key __AM_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100m;               # kubectl apply 大 YAML

    # ── 流式代理：exec / port-forward / watch（§9）────────────────
    location /proxy/ {
        proxy_pass http://am_platform;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout  3600s;           # 长连接（watch 空闲期）
        proxy_send_timeout  3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── Agent 隧道：长连接 + 快速死链检测（§6.3）──────────────────
    location /tunnel {
        proxy_pass http://am_platform;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout  75s;             # 必须 > Agent WS ping 间隔 20s
        proxy_send_timeout  75s;
        proxy_buffering off;
    }

    # ── 控制面 API：短超时 ─────────────────────────────────────────
    location / {
        proxy_pass http://am_platform;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";        # 恢复 keepalive
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    location /healthz {
        proxy_pass http://am_platform;
        access_log off;
    }
}
