name: kamc

# 本地/验收用一键环境：平台 + PostgreSQL + Redis（可选 MinIO）。
# 生产部署请使用 deploy/helm 或 deploy/k8s，不要直接使用本文件。
#
# 使用：
#   cp deploy/docker/.env.example deploy/docker/.env
#   docker compose -f deploy/docker/compose.yaml up -d --build
#   docker compose -f deploy/docker/compose.yaml --profile minio up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kamc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kamc}
      POSTGRES_DB: ${POSTGRES_DB:-kamc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 可选对象存储：docker compose --profile minio up -d
  # 启用后把 .env 中 AM_AVATAR_BACKEND 设为 minio，并配置 endpoint/凭据。
  # 说明：MinIO 官方社区镜像已下线，这里使用 Chainguard 构建的等价二进制；
  # 生产环境可换成自建镜像或任意 S3 兼容服务。
  minio-init:
    image: ${ALPINE_IMAGE:-alpine:latest}
    profiles: ["minio"]
    user: "0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 65532:65532 /data"]
    volumes:
      - miniodata:/data

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    profiles: ["minio"]
    restart: unless-stopped
    user: "65532:65532"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kamc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kamc-minio-secret}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  # 平台以 uid 10001 运行；命名卷首次挂载是 root 所有，需要初始化权限。
  platform-init:
    image: ${ALPINE_IMAGE:-alpine:latest}
    user: "0"
    command: ["sh", "-c", "mkdir -p /data/avatar /audit && chown -R 10001:10001 /data /audit"]
    volumes:
      - avatardata:/data/avatar
      - auditdata:/audit

  platform:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: kamc-platform:${KAMC_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      platform-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
        required: false
    environment:
      AM_ENV: ${AM_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-kamc}:${POSTGRES_PASSWORD:-kamc}@postgres:5432/${POSTGRES_DB:-kamc}?sslmode=disable
      REDIS_ADDR: redis:6379
      AM_EXTERNAL_URL: ${AM_EXTERNAL_URL:-http://localhost:8080}
      AM_JWT_ISSUER: ${AM_JWT_ISSUER:-http://localhost:8080}
      AM_PASSWORD_LOGIN: ${AM_PASSWORD_LOGIN:-1}
      AM_PASSWORD_LOGIN_USER: ${AM_PASSWORD_LOGIN_USER:-sysadmin}
      AM_PASSWORD_LOGIN_PASSWORD: ${AM_PASSWORD_LOGIN_PASSWORD:-sysadmin123}
      AM_AVATAR_SECRET: ${AM_AVATAR_SECRET:-}
      AM_AVATAR_BACKEND: ${AM_AVATAR_BACKEND:-auto}
      AM_AVATAR_DIR: /data/avatar
      AM_AVATAR_MINIO_ENDPOINT: ${AM_AVATAR_MINIO_ENDPOINT:-}
      AM_AVATAR_MINIO_ACCESS_KEY: ${AM_AVATAR_MINIO_ACCESS_KEY:-kamc}
      AM_AVATAR_MINIO_SECRET_KEY: ${AM_AVATAR_MINIO_SECRET_KEY:-kamc-minio-secret}
      AM_AVATAR_MINIO_BUCKET: ${AM_AVATAR_MINIO_BUCKET:-kamc-avatars}
      AM_AVATAR_MINIO_USE_SSL: ${AM_AVATAR_MINIO_USE_SSL:-false}
      AM_AVATAR_MINIO_REGION: ${AM_AVATAR_MINIO_REGION:-}
      AM_AVATAR_MINIO_PREFIX: ${AM_AVATAR_MINIO_PREFIX:-avatars/}
      AM_AUDIT_SPILL_FILE: /audit/audit-spill.jsonl
    ports:
      - "${KAMC_PORT:-8080}:8080"
    volumes:
      - avatardata:/data/avatar
      - auditdata:/audit
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
  miniodata:
  avatardata:
  auditdata:
