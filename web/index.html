<!doctype html>
<html lang="zh-CN" data-theme="kamc-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131820" />
    <title>Kubernetes Access Manager Center</title>
    <script>
      // 首屏前确定主题，避免深浅色闪跳。
      (function () {
        try {
          var saved = localStorage.getItem('kamc_theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'kamc-dark' : 'kamc-light',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'kamc-dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
