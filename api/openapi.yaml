openapi: 3.0.3
info:
  title: kamc 平台 API
  version: 2.0.0
  description: |
    Kubernetes Access Manager Center 平台 HTTP API（设计文档 docs/design.md v2.0）。

    ## 响应约定（错误处理模式 B）

    `/api/v1/**` 业务端点统一返回信封结构（HTTP 恒 200，业务码在 `status` 字段）：

    ```json
    {"status": 0, "message": "success", "data": {}}
    ```

    业务码分段：0 成功；1xxxx 通用；2xxxx 集群域；3xxxx Token 域；4xxxx 策略域；
    ≥50000 系统错误（此时 HTTP 状态码为 500）。

    中间件层错误（认证/鉴权/限流）为纯文本响应：401（未认证，含 WWW-Authenticate）、
    403（管理员组不足或 Casbin 拒绝）、429（限流，含 Retry-After）、501/503（功能未装配/集群不可达）。

    ## 鉴权方式

    | 端点类别 | 凭证 | 说明 |
    | --- | --- | --- |
    | 管理面 `/api/v1/**`（除 agent/register） | 平台 JWT（Bearer） | 管理操作另需 `am:admin` 组（AM_ADMIN_GROUP） |
    | 自服务（kubeconfig 生成、登出、/auth/me） | 平台 JWT（Bearer） | 仅需有效身份 |
    | `/api/v1/agent/register` | 注册 Token（Bearer，`am-reg-` 前缀） | 一次性换取长期 Token |
    | `/tunnel` | 长期 Agent Token（Bearer，`am-clu-` 前缀） | Agent 专用（WebSocket 升级） |
    | `/proxy/{clusterID}/**` | 平台 JWT（Bearer） | 数据面，Casbin 资源级鉴权 + Impersonation 注入 |

    平台 JWT 获取途径：OIDC 登录（/auth/login → /auth/callback）、
    ID Token 兑换（/auth/token-exchange，exec plugin 用）、
    内置账号密码登录（/auth/password-login，默认 sysadmin/sysadmin123）。
    开发环境可经 `/auth/dev-token` 直签（AM_DEV_ISSUE_TOKEN=1，生产默认 404）。
servers:
  - url: https://{domain}
    variables:
      domain:
        default: access-manager.example.com
        description: 平台对外域名
tags:
  - name: 运维
    description: 健康检查与构建信息
  - name: 认证
    description: OIDC 登录、平台 JWT 签发与吊销
  - name: 集群管理
    description: 目标集群注册与管理（管理面）
  - name: Agent Token
    description: Agent Token 签发/轮换/吊销/注册交换
  - name: kubeconfig
    description: 用户 kubeconfig 生成（自服务）
  - name: 权限策略
    description: 组织/用户直接策略与集群资源发现（管理面）
  - name: 机器人
    description: CICD 机器人长期 kubeconfig 签发与直接策略管理（管理面）
  - name: 审计
    description: 审计事件查询（管理面）
  - name: 数据面
    description: kubectl 请求代理（JWT + Casbin + Impersonation）
  - name: Agent
    description: Agent 反向隧道入口

paths:
  /healthz:
    get:
      tags: [运维]
      summary: 存活探针
      description: 进程存活即 200，不检查任何依赖。
      security: []
      responses:
        '200':
          description: ok（text/plain）

  /readyz:
    get:
      tags: [运维]
      summary: 就绪探针
      description: 数据库不可达返回 503——LB/编排据此摘流（优雅下线第一步，§7.5）。
      security: []
      responses:
        '200': {description: ready（text/plain）}
        '503': {description: not ready（text/plain）}

  /version:
    get:
      tags: [运维]
      summary: 构建版本信息
      security: []
      responses:
        '200':
          description: 版本信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          version: {type: string, example: dev}
                          commit: {type: string, example: 8d5c683}
                          component: {type: string, example: platform}

  /metrics:
    get:
      tags: [运维]
      summary: Prometheus 指标
      description: |
        promhttp 暴露（kamc_ 前缀）。集群内网约定端点，鉴权属部署层
        （NetworkPolicy/内网隔离）。指标清单见设计文档 §12.3。
      security: []
      responses:
        '200':
          description: Prometheus 文本格式
          content:
            text/plain:
              schema: {type: string}

  /auth/login:
    get:
      tags: [认证]
      summary: 发起 OIDC 登录
      description: 302 跳转到 OIDC Provider 授权端点（携带一次性 state 防 CSRF，10 分钟有效）。
      security: []
      responses:
        '302':
          description: 重定向到授权端点（Location 含 state）
        '503':
          description: OIDC 未配置（OIDC_ISSUER 为空）
        '502':
          description: Provider discovery 不可达

  /auth/callback:
    get:
      tags: [认证]
      summary: OIDC 回调兑换
      description: 校验一次性 state → 授权码换 ID Token → 验签 → 签发平台 JWT。
      security: []
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: 平台 JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/IssuedCredential'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}

  /auth/token-exchange:
    post:
      tags: [认证]
      summary: OIDC ID Token 兑换平台 JWT
      description: |
        k8s-am-login exec credential plugin 的身份入口：ID Token 经 Provider
        JWKS 验签（iss/aud/exp/签名）后按 sub/groups 签发平台 JWT。
        失败一律 401（不区分原因，防枚举）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: {type: string}
      responses:
        '200':
          description: 平台 JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/IssuedCredential'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '503': {description: OIDC 未配置}

  /auth/dev-token:
    post:
      tags: [认证]
      summary: 开发直签 Token（仅开发环境）
      description: |
        AM_DEV_ISSUE_TOKEN=1 时可用；生产环境返回 404，不存在绕过 SSO 的通道。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sub]
              properties:
                sub: {type: string}
                email: {type: string}
                groups: {type: array, items: {type: string}}
      responses:
        '200':
          description: 平台 JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/IssuedCredential'}
        '404': {description: 未开启开发开关}

  /auth/password-login:
    post:
      tags: [认证]
      summary: 内置管理员账号密码登录
      description: |
        默认账号 sysadmin/sysadmin123，可用 AM_PASSWORD_LOGIN_USER /
        AM_PASSWORD_LOGIN_PASSWORD 覆盖，AM_PASSWORD_LOGIN=0 关闭。
        成功后签发管理员平台 JWT。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, example: sysadmin}
                password: {type: string, example: sysadmin123}
      responses:
        '200':
          description: 平台 JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/IssuedCredential'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '404': {description: 密码登录未启用（AM_PASSWORD_LOGIN=0）}

  /auth/me:
    get:
      tags: [认证]
      summary: 当前身份
      description: 回显 Bearer Token 的 claims（调试与客户端自检）。
      security:
        - platformJWT: []
      responses:
        '200':
          description: claims
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Claims'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}

  /auth/logout:
    post:
      tags: [认证]
      summary: 登出
      description: 当前 Token 的 jti 进入黑名单（TTL=剩余有效期），立即失效；同用户其他 Token 不受影响。
      security:
        - platformJWT: []
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}

  /.well-known/jwks.json:
    get:
      tags: [认证]
      summary: 平台 JWT 公钥集（JWKS）
      description: 全部 kid 的 RSA 公钥（§4.3 轮换期间多 kid 并存）。
      security: []
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JWKS'}

  /api/v1/agent/register:
    post:
      tags: [Agent Token]
      summary: 注册交换（一次性）
      description: |
        Agent 首次注册：携带注册 Token（Bearer，`am-reg-` 前缀，1h 有效）
        换取长期 Token（`am-clu-` 前缀）。交换成功即删除注册 Token（一次性）；
        长期 Token 不可再次交换。失败一律 10001（HTTP 200，防枚举）。
      security:
        - registerToken: []
      responses:
        '200':
          description: 长期 Token（明文仅此一次）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/IssuedToken'}

  /api/v1/clusters:
    get:
      tags: [集群管理]
      summary: 集群列表
      security:
        - platformJWT: []
      responses:
        '200':
          description: 集群列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Cluster'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}
    post:
      tags: [集群管理]
      summary: 注册集群
      security:
        - platformJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateClusterRequest'}
      responses:
        '200':
          description: >-
            信封响应（HTTP 恒 200，业务码在 status 字段）：0=成功（data 为集群）；
            10001 参数非法；20002 集群已存在；50000 系统错误（HTTP 500）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Cluster'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/clusters/{id}:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
    get:
      tags: [集群管理]
      summary: 查询集群
      security:
        - platformJWT: []
      responses:
        '200':
          description: 集群信息（20002=不存在）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Cluster'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}
    delete:
      tags: [集群管理]
      summary: 注销集群
      security:
        - platformJWT: []
      responses:
        '200':
          description: 删除成功（20001=不存在）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/clusters/{id}/tokens:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
    get:
      tags: [Agent Token]
      summary: Token 元数据列表
      description: 不含哈希与明文。status：active / rotating（旧 Token 在宽限期内）。
      security:
        - platformJWT: []
      responses:
        '200':
          description: Token 元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/TokenDTO'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}
    post:
      tags: [Agent Token]
      summary: 签发 Token
      description: |
        kind=longterm：轮换语义——现有 Token 进 24h 宽限期（PreviousHash）；
        kind=register：1h 有效。明文仅在本次响应返回，平台只存 SHA256 哈希。
      security:
        - platformJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [register, longterm]
      responses:
        '200':
          description: 明文 Token（仅此一次）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/IssuedToken'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/clusters/{id}/tokens/{kind}:
    delete:
      tags: [Agent Token]
      summary: 吊销 Token
      description: 立即失效，无宽限期（30001=不存在）。
      security:
        - platformJWT: []
      parameters:
        - $ref: '#/components/parameters/ClusterID'
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [register, longterm]}
      responses:
        '200':
          description: 已吊销
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/clusters/{id}/kubeconfig:
    get:
      tags: [kubeconfig]
      summary: 生成 kubeconfig（自服务）
      description: |
        产物只承载调用者自己的身份，数据面授权仍由请求时 Casbin 决定。
        mode=static 嵌入调用者当前平台 JWT（过期需重新下载）；
        mode=exec 写 k8s-am-login 命令行（推荐）。
        server 指向 {external}/proxy/{clusterID}；平台 CA 经
        AM_KUBECONFIG_CA_FILE 可选嵌入（certificate-authority-data）。
      security:
        - platformJWT: []
      parameters:
        - $ref: '#/components/parameters/ClusterID'
        - name: mode
          in: query
          schema: {type: string, enum: [static, exec], default: exec}
      responses:
        '200':
          description: kubeconfig YAML（下载）
          content:
            application/yaml:
              schema: {type: string}
        '400':
          description: 参数非法 / 集群不存在（纯文本）
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}

  /api/v1/profile:
    get:
      tags: [认证]
      summary: 当前登录用户资料（自服务）
      description: |
        仅需 JWT：返回当前登录用户在平台用户目录中的记录（头像、昵称、
        组、来源等）。JWT 只承载身份与组，头像等展示字段经此接口读取，
        修改资料后无需重新登录即可生效。
      security:
        - platformJWT: []
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/PlatformUser'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}

  /api/v1/profile/avatar:
    post:
      tags: [认证]
      summary: 修改自己的头像（自服务）
      description: |
        仅需 JWT：上传 raw 图片体（image/png、image/jpeg、image/webp、
        image/gif，≤2MB），保存到平台头像目录并返回带签名 token 的展示 URL。
      security:
        - platformJWT: []
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, format: binary}
          image/jpeg:
            schema: {type: string, format: binary}
          image/webp:
            schema: {type: string, format: binary}
          image/gif:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: 新头像 URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          avatar_url: {type: string}
        '400':
          description: 类型/大小非法（纯文本）
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '503':
          description: 头像存储未启用（纯文本）

  /api/v1/clusters/{id}/info:
    get:
      tags: [集群]
      summary: 集群概要信息（kubectl cluster-info 语义）
      description: |
        经 Agent 隧道读取目标集群的版本与控制平面/CoreDNS 地址：
        版本来自 kube-apiserver /version；控制平面地址来自 default/kubernetes
        Endpoints；CoreDNS 来自 kube-system/kube-dns Service。
        地址读取失败仅字段留空（降级），集群未接入时返回 20003。
      security:
        - platformJWT: []
      parameters:
        - $ref: '#/components/parameters/ClusterID'
      responses:
        '200':
          description: 集群概要信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ClusterInfo'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/clusters/{id}/agent-install:
    post:
      tags: [集群]
      summary: 生成 Agent 一键安装预览
      description: |
        用刚签发的长期 Agent Token 生成一键安装清单预览（kubectl 命令 + YAML）。
        明文 Token 仅在签发响应中出现且平台只存哈希，预览必须在签发窗口内发起；
        Token 归属集群即安装目标。
      security:
        - platformJWT: []
      parameters:
        - $ref: '#/components/parameters/ClusterID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentInstallPreviewRequest'}
      responses:
        '200':
          description: 安装预览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/AgentInstallPreview'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /agent-install.yaml:
    get:
      tags: [集群]
      summary: 拉取 Agent 一键安装清单（kubectl apply 用）
      description: |
        kubectl apply -f 的拉取端点：Agent 长期 Token 即拉取凭证（与清单内嵌
        Token 同源，持有即授权），不入 JWT 保护组。Token 无效返回 401 纯文本。
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 安装清单 YAML
          content:
            application/yaml:
              schema: {type: string}
        '401':
          description: Token 无效（纯文本）

  /api/v1/auth/revoke:
    post:
      tags: [认证]
      summary: 踢出用户（管理面）
      description: |
        用户 epoch 递增：该时刻之前签发的该用户全部 Token 立即失效
        （本地即时 + Redis 跨副本同步，一致性窗口 5s）。
        同一秒内重新登录可获得携带新 epoch 的 Token，不受影响。
      security:
        - platformJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sub]
              properties:
                sub: {type: string}
      responses:
        '200':
          description: 已踢出
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/audit:
    get:
      tags: [审计]
      summary: 审计查询（管理面）
      description: |
        kind=platform 返回平台事件（登录/Token/下载/管理动作，同步输出到 stdio）；
        kind=cluster 返回集群操作（数据面 API，含原始请求/响应前缀，可经 syslog 导出）。
      security:
        - platformJWT: []
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [platform, cluster]}}
        - {name: user, in: query, schema: {type: string}}
        - {name: cluster, in: query, schema: {type: string}}
        - {name: event, in: query, schema: {type: string, description: '事件名精确匹配（如 k8s-api）'}}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}}
      responses:
        '200':
          description: 事件列表（时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/AuditEvent'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/policies:
    get:
      tags: [权限策略]
      summary: 策略列表
      description: 返回解析后的主体类型/主体/集群/命名空间/资源/动作，以及原始四元组。
      security:
        - platformJWT: []
      responses:
        '200':
          description: 策略列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/PolicyDTO'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}
    post:
      tags: [权限策略]
      summary: 批量创建策略
      description: |
        主体只能是平台组（org）或用户（user）之一；集群单选。
        每条资源规则按 namespace/resource/subresource/verbs 展开为 Casbin 四元组：
        - namespace `*` 生成 `*/resource`，并补充 `cluster/resource` 覆盖全命名空间 list；
        - 具体 namespace 生成 `<ns>/resource`；
        - cluster-scoped 资源生成 `cluster/resource`；
        - resource `*` 自动授予全部动作（act=`.*`）。
      security:
        - platformJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePolicyRequest'}
      responses:
        '200':
          description: 创建结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/CreatePolicyResult'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}
    delete:
      tags: [权限策略]
      summary: 删除策略
      description: 使用原始四元组精确匹配删除；不存在返回 40001。
      security:
        - platformJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemovePolicyRequest'}
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/clusters/{id}/resources:
    get:
      tags: [权限策略]
      summary: 集群资源目录（GVR + 动词 + namespace）
      description: 通过 Agent 隧道读取 Kubernetes discovery；缓存 5 分钟，refresh=1 强制刷新。
      security:
        - platformJWT: []
      parameters:
        - $ref: '#/components/parameters/ClusterID'
        - {name: refresh, in: query, schema: {type: string, enum: ["1"]}}
      responses:
        '200':
          description: 资源目录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ClusterResourcesResponse'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}
        '503': {description: 集群不可达或目录未装配}

  /proxy/{clusterID}:
    get:
      tags: [数据面]
      summary: Kubernetes API 代理（根路径；全部 HTTP 方法同语义，此处以 GET 代表）
      description: |
        kubectl 经 kubeconfig（server={platform}/proxy/{clusterID}）访问目标集群的入口。
        完整 §8.1 顺序：JWT 校验 → 剥离用户 Impersonate-* 头（防伪造）→
        Casbin 鉴权（RequestInfo 语义四元组，本地缓存零外部依赖）→
        注入平台控制的 Impersonate-User/Group → 经隧道转发 →
        API Server RBAC 第二道防线。

        流式：WebSocket 升级按子协议分流——`v4/v5.channel.k8s.io`（exec/attach）
        经 StreamTranslatorHandler 翻译为 SPDY；`SPDY/3.1+portforward.k8s.io`
        （port-forward）经 TunnelingHandler 直通；旧版 SPDY 客户端原样透传。
        限流：按用户滑动窗口（AM_RATE_LIMIT），超限 429 + Retry-After。
      security:
        - platformJWT: []
      parameters:
        - $ref: '#/components/parameters/ClusterID'
      responses:
        '200':
          description: 上游响应原样透传（含流式/101 升级；任意内容类型）
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403':
          description: Casbin 拒绝（fail-closed；鉴权组件故障同样 403）
          content:
            text/plain:
              schema: {type: string}
        '429':
          description: 超出限流阈值
          headers:
            Retry-After: {schema: {type: integer}, description: 窗口秒数}
        '501': {description: 隧道模块未启用}
        '503':
          description: 集群不可达（Agent 离线/重连中）
    post:
      tags: [数据面]
      summary: Kubernetes API 代理（写语义；PUT/PATCH/DELETE 同构）
      security:
        - platformJWT: []
      parameters:
        - $ref: '#/components/parameters/ClusterID'
      responses:
        '200': {description: 上游响应透传}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {description: Casbin 拒绝}
        '429': {description: 超出限流阈值}
        '503': {description: 集群不可达}
  /proxy/{clusterID}/{path}:
    get:
      tags: [数据面]
      summary: Kubernetes API 代理（子路径；全部 HTTP 方法同语义，此处以 GET 代表）
      description: 路径通配 `*`，apiserver 收到 strip 前缀后的干净路径（FIX-6）。
      security:
        - platformJWT: []
      parameters:
        - $ref: '#/components/parameters/ClusterID'
        - name: path
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: 上游响应透传}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {description: Casbin 拒绝}
        '429': {description: 超出限流阈值}
        '503': {description: 集群不可达}
    post:
      tags: [数据面]
      summary: Kubernetes API 代理（子路径，写语义）
      security:
        - platformJWT: []
      parameters:
        - $ref: '#/components/parameters/ClusterID'
        - name: path
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: 上游响应透传}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {description: Casbin 拒绝}
        '429': {description: 超出限流阈值}
        '503': {description: 集群不可达}

  /tunnel:
    get:
      tags: [Agent]
      summary: Agent 反向隧道入口
      description: |
        Agent 专用（部署于目标集群）：Bearer 长期 Token（哈希比对 + 24h 轮换宽限）
        → WebSocket 升级 → yamux 会话接管 → 集群转 online。
        升级后的连接由平台监控：读活性看门狗（75s 无入站帧判死）、
        优雅下线发送 1001 GoingAway（Agent 立即重连其他副本）。
        Agent 不应向平台开流（数据面由平台发起）——入流防御性关闭。
      security:
        - agentToken: []
      parameters:
        - name: X-Cluster-ID
          in: header
          required: true
          schema: {type: string}
          description: 必须与 Token 归属集群一致（防跨集群误注册）
        - name: X-Agent-ID
          in: header
          required: true
          schema: {type: string}
          description: Agent 实例标识（双副本须不同；默认 hostname）
      responses:
        '101':
          description: WebSocket 协议切换成功（此后为 yamux 字节流）
        '400': {description: 缺 X-Agent-ID}
        '401': {description: Token 无效/过期/集群不匹配（防枚举，不区分原因）}
        '503': {description: 隧道模块未启用}

  /api/v1/robots:
    get:
      tags: [机器人]
      summary: 机器人列表
      description: 不含 Token 明文；status 按到期时间计算（active/expired）。
      security:
        - platformJWT: []
      responses:
        '200':
          description: 机器人列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Robot'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}
    post:
      tags: [机器人]
      summary: 签发机器人长期 kubeconfig
      description: |
        创建机器人身份并使用长期 JWT（默认 365 天，`AM_ROBOT_TOKEN_TTL`）生成
        static kubeconfig。权限需管理员通过 `user:robot:<id>` 直接策略授予。
        响应中的 kubeconfig 为 YAML 字符串，后续可通过下载接口重新生成同一 jti 的凭证。
      security:
        - platformJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRobotRequest'}
      responses:
        '200':
          description: 机器人 + kubeconfig
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/RobotKubeconfigResponse'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/robots/{id}:
    delete:
      tags: [机器人]
      summary: 吊销机器人
      description: 删除记录、清理 `user:robot:<id>` 的全部直接策略，并将该机器人 JWT 的 jti 加入黑名单。
      security:
        - platformJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 已吊销（30003=不存在）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/robots/{id}/kubeconfig:
    get:
      tags: [机器人]
      summary: 下载机器人 kubeconfig
      security:
        - platformJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: kubeconfig YAML
          content:
            application/yaml:
              schema: {type: string}
        '400': {description: 机器人不存在/已过期/集群不存在（纯文本）}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/system:
    get:
      tags: [运维]
      summary: 平台进程运行时信息
      description: Go runtime、内存、goroutine 与 DB 连接池统计（管理面）。
      security:
        - platformJWT: []
      responses:
        '200':
          description: 运行时信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/SystemInfo'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

  /api/v1/platform/info:
    get:
      tags: [运维]
      summary: 平台信息页数据
      description: |
        平台设置 / SSO 接入 / 数据库 / 缓存 / Go 运行时的配置
        快照与聚合指标（管理面）。密钥与明文密码不出现在响应中（DSN 已脱敏）。
      security:
        - platformJWT: []
      responses:
        '200':
          description: 平台信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/PlatformInfo'}
        '401': {$ref: '#/components/responses/PlainTextUnauthorized'}
        '403': {$ref: '#/components/responses/PlainTextForbidden'}

components:
  securitySchemes:
    platformJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 平台 JWT（RS256，1h；OIDC 登录 / token-exchange / dev-token 签发）
    agentToken:
      type: http
      scheme: bearer
      description: 长期 Agent Token（am-clu- 前缀，24h 轮换宽限期）
    registerToken:
      type: http
      scheme: bearer
      description: 注册 Token（am-reg- 前缀，1h 有效，一次性）

  parameters:
    ClusterID:
      name: id
      in: path
      required: true
      schema: {type: string, maxLength: 64}
      description: 集群 ID（Casbin dom）

  responses:
    PlainTextUnauthorized:
      description: '未认证（WWW-Authenticate: Bearer；不区分过期/无效/吊销，防枚举）' 
      content:
        text/plain:
          schema: {type: string}
    PlainTextForbidden:
      description: 禁止（管理员组不足）
      content:
        text/plain:
          schema: {type: string}

  schemas:
    Envelope:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
          description: 业务码，0=成功；≥50000 系统错误（HTTP 500）
          example: 0
        message:
          type: string
          example: success
        data:
          description: 业务数据（错误响应缺省）

    Cluster:
      type: object
      properties:
        id: {type: string, description: 集群 ID（Casbin dom）}
        name: {type: string}
        desc: {type: string}
        status:
          type: string
          enum: [pending, online, offline]
          description: pending=已注册未接入；online=至少一条隧道在线
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    CreateClusterRequest:
      type: object
      required: [id, name]
      properties:
        id: {type: string, maxLength: 64}
        name: {type: string}
        desc: {type: string}

    IssuedToken:
      type: object
      description: 签发的 Agent Token（明文仅此一次）
      properties:
        token:
          type: string
          description: am-clu- / am-reg- 前缀
        kind:
          type: string
          enum: [register, longterm]
        grace_ends_at:
          type: string
          format: date-time
          description: 轮换时旧 Token 的宽限期截止（longterm 轮换时返回）

    IssuedCredential:
      type: object
      description: 平台 JWT 签发结果
      properties:
        token: {type: string}
        expires_at: {type: string, format: date-time}
        token_type: {type: string, example: Bearer}

    TokenDTO:
      type: object
      description: Token 元数据（永不包含哈希与明文）
      properties:
        cluster_id: {type: string}
        kind: {type: string, enum: [register, longterm]}
        status: {type: string, enum: [active, rotating]}
        expires_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    PolicyDTO:
      type: object
      properties:
        subject_type: {type: string, enum: [org, user, robot, legacy]}
        subject: {type: string}
        cluster: {type: string}
        namespace: {type: string, description: "* 表示全部命名空间；cluster-scoped 为空"}
        resource: {type: string}
        subresource: {type: string}
        verbs: {type: array, items: {type: string}}
        sub: {type: string, description: '原始 Casbin 主体（org:/user: 前缀）'}
        dom: {type: string}
        obj: {type: string}
        act: {type: string}

    PolicyRuleInput:
      type: object
      required: [resource, verbs]
      properties:
        namespace: {type: string, description: "* 或具体 namespace；cluster-scoped 留空"}
        resource: {type: string, example: pods}
        subresource: {type: string, example: exec}
        namespaced: {type: boolean}
        verbs:
          type: array
          items: {type: string}
          example: [get, list, watch]

    CreatePolicyRequest:
      type: object
      required: [subject_type, subject, cluster, rules]
      properties:
        subject_type: {type: string, enum: [org, user, robot], description: 'subject 语义：robot 时为机器人 ID（平台签发）'}
        subject: {type: string, example: dev-team}
        cluster: {type: string, example: prod-bj}
        rules:
          type: array
          items: {$ref: '#/components/schemas/PolicyRuleInput'}

    RemovePolicyRequest:
      type: object
      required: [sub, dom, obj, act]
      properties:
        sub: {type: string, example: 'org:dev-team'}
        dom: {type: string, example: prod-bj}
        obj: {type: string, example: '*/pods'}
        act: {type: string, example: 'get|list'}

    CreatePolicyResult:
      type: object
      properties:
        created: {type: integer}
        policies:
          type: array
          items: {$ref: '#/components/schemas/PolicyDTO'}

    PlatformUser:
      type: object
      properties:
        uid: {type: string, description: 平台内部唯一 ID}
        username: {type: string}
        nickname: {type: string}
        avatar_url: {type: string, description: '头像展示 URL（平台签名的 /avatars/{uid}?token=… 或外部 URL）'}
        groups:
          type: array
          items: {type: string}
        source: {type: string, enum: [sso, ldap, local]}
        email: {type: string}
        metadata: {type: object, additionalProperties: true}
        last_login: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    AuditEvent:
      type: object
      properties:
        id: {type: integer, format: int64}
        kind: {type: string, enum: [platform, cluster]}
        event: {type: string, description: '事件名（login-success/kubeconfig-download/token-issue/k8s-api…）'}
        timestamp: {type: string, format: date-time}
        user: {type: string}
        groups: {type: string, description: 逗号分隔组串}
        cluster: {type: string}
        method: {type: string}
        path: {type: string, description: 原始请求 URI（含 query）}
        object: {type: string, description: Casbin 语义资源串（<ns>/<resource> 等）}
        verb: {type: string, description: K8s verb}
        allowed: {type: boolean}
        reason: {type: string}
        source_ip: {type: string}
        forwarded_for: {type: string}
        user_agent: {type: string}
        geo_country: {type: string}
        geo_region: {type: string}
        geo_city: {type: string}
        status_code: {type: integer}
        request_body: {type: string, description: 完整请求报文（起始行+头+格式化 JSON body，body 上限 16KB，敏感头脱敏）}
        response_body: {type: string, description: 完整响应报文（状态行+头+格式化 JSON body，body 上限 16KB，gzip 自动解压）}
        latency_ms: {type: integer, format: int64}

    SystemInfo:
      type: object
      properties:
        go_version: {type: string, example: go1.27.2}
        goroutines: {type: integer}
        num_cpu: {type: integer}
        heap_alloc_bytes: {type: integer, format: int64}
        heap_sys_bytes: {type: integer, format: int64}
        sys_bytes: {type: integer, format: int64}
        total_alloc_bytes: {type: integer, format: int64}
        num_gc: {type: integer}
        uptime_seconds: {type: integer, format: int64}
        db_open_connections: {type: integer}
        db_in_use: {type: integer}
        db_idle: {type: integer}
        db_wait_count: {type: integer, format: int64}
        db_max_open_connections: {type: integer}

    ClusterVersionInfo:
      type: object
      properties:
        major: {type: string, example: '1'}
        minor: {type: string, example: '31'}
        git_version: {type: string, example: v1.31.4}
        git_commit: {type: string}
        build_date: {type: string}
        go_version: {type: string, example: go1.22.8}
        compiler: {type: string, example: gc}
        platform: {type: string, example: linux/amd64}

    ClusterInfo:
      type: object
      properties:
        version: {$ref: '#/components/schemas/ClusterVersionInfo'}
        control_plane:
          type: string
          description: 控制平面地址（default/kubernetes Endpoints，如 https://10.0.0.1:6443）
        coredns:
          type: string
          description: CoreDNS 地址（kube-system/kube-dns Service，如 10.96.0.10:53）
        nodes:
          type: array
          description: 集群节点列表（读取失败为空，不视为失败）
          items: {$ref: '#/components/schemas/ClusterNodeInfo'}
        fetched_at: {type: string, format: date-time}

    ClusterNodeInfo:
      type: object
      properties:
        name: {type: string}
        roles:
          type: array
          description: node-role.kubernetes.io/* 标签（缺省 worker）
          items: {type: string}
        ready: {type: boolean}
        unschedulable: {type: boolean}
        internal_ip: {type: string}
        kubelet_version: {type: string, example: v1.31.4}
        os_image: {type: string}
        architecture: {type: string, example: amd64}
        runtime: {type: string, example: 'containerd://1.7.22'}
        cpu: {type: string, example: '4'}
        memory: {type: string, example: 16 Gi}

    AgentInstallPreviewRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: 刚签发的长期 Agent Token 明文（平台只存哈希）

    AgentInstallPreview:
      type: object
      properties:
        cluster_id: {type: string}
        image: {type: string, example: 'registry.example.com/kamc/k8s-am-agent:v1.0.0'}
        tunnel_url: {type: string, example: 'wss://kamc.example.com/tunnel'}
        apply_command:
          type: string
          description: kubectl apply -f 命令（URL 内含 Agent Token）
        yaml: {type: string, description: 完整安装清单 YAML}

    PlatformInfo:
      type: object
      properties:
        version:
          type: object
          properties:
            version: {type: string}
            commit: {type: string}
            component: {type: string}
        settings:
          type: object
          properties:
            listen_addr: {type: string}
            external_url: {type: string}
            admin_group: {type: string}
            password_login: {type: boolean}
            password_user: {type: string}
            robot_token_ttl: {type: integer, format: int64, description: 秒}
            agent_image: {type: string}
        sso:
          type: object
          properties:
            enabled: {type: boolean}
            issuer: {type: string}
            client_id: {type: string}
            redirect_url: {type: string}
        database:
          type: object
          properties:
            dsn: {type: string, description: 已脱敏连接串（password=***）}
            open_connections: {type: integer}
            in_use: {type: integer}
            idle: {type: integer}
            max_open_connections: {type: integer}
            wait_count: {type: integer, format: int64}
        cache:
          type: object
          properties:
            enabled: {type: boolean}
            addrs: {type: string}
            db: {type: integer}
        runtime:
          type: object
          properties:
            go_version: {type: string}
            goroutines: {type: integer}
            num_cpu: {type: integer}
            heap_alloc_bytes: {type: integer, format: int64}
            sys_bytes: {type: integer, format: int64}
            total_alloc_bytes: {type: integer, format: int64}
            num_gc: {type: integer}
            uptime_seconds: {type: integer, format: int64}

    SubjectOption:
      type: object
      properties:
        value: {type: string}
        label: {type: string}

    ClusterResource:
      type: object
      properties:
        group: {type: string}
        version: {type: string}
        resource: {type: string}
        subresource: {type: string}
        gvr: {type: string, example: apps/v1/deployments}
        kind: {type: string}
        namespaced: {type: boolean}
        verbs: {type: array, items: {type: string}}

    ClusterResourcesResponse:
      type: object
      properties:
        cluster_id: {type: string}
        namespaces: {type: array, items: {type: string}}
        resources: {type: array, items: {$ref: '#/components/schemas/ClusterResource'}}
        partial: {type: boolean}
        failed_group_versions: {type: array, items: {type: string}}
        cached: {type: boolean}
        discovered_at: {type: string, format: date-time}

    Robot:
      type: object
      properties:
        id: {type: string, example: robot-1a2b3c4d5e6f7a8b}
        name: {type: string, example: ci-deployer}
        cluster_id: {type: string, example: prod-bj}
        sub: {type: string, example: 'robot:robot-1a2b3c4d5e6f7a8b'}
        status: {type: string, enum: [active, expired]}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}

    CreateRobotRequest:
      type: object
      required: [name, cluster_id]
      properties:
        name: {type: string, maxLength: 128, example: ci-deployer}
        cluster_id: {type: string, example: prod-bj}

    RobotKubeconfigResponse:
      type: object
      properties:
        robot: {$ref: '#/components/schemas/Robot'}
        kubeconfig: {type: string, description: kubeconfig YAML（static 长期 Token）}

    Claims:
      type: object
      description: 平台 JWT 载荷（§4.2）
      properties:
        iss: {type: string}
        sub: {type: string}
        aud: {type: array, items: {type: string}}
        exp: {type: integer}
        iat: {type: integer}
        jti: {type: string}
        email: {type: string}
        groups: {type: array, items: {type: string}}
        am_ep:
          type: integer
          description: 签发时的用户吊销纪元（踢出语义，§4.2）

    JWKS:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty: {type: string, example: RSA}
              kid: {type: string, example: jwt-1}
              use: {type: string, example: sig}
              alg: {type: string, example: RS256}
              n: {type: string}
              e: {type: string}
